&Открыть файл…	script-binding classicbar/open
П&лейлист	$playlist

&Пауза	cycle pause	hidden=idle_active or pause
&Воспроизвести	cycle pause	hidden=not pause and not idle_active	disabled=idle_active
&Стоп	no-osd set pause yes; no-osd seek 0 absolute	disabled=idle_active

Воспро&изведение
	&Следующий файл	playlist-next	disabled=playlist_count < 2
	&Предыдущий файл	playlist-prev	disabled=playlist_count < 2

	С&корость
		50%	set speed 0.5	checked=speed == 0.5
		75%	set speed 0.75	checked=speed == 0.75
		&100%	set speed 1	checked=speed == 1
		125%	set speed 1.25	checked=speed == 1.25
		150%	set speed 1.5	checked=speed == 1.5
		200%	set speed 2	checked=speed == 2
	По&втор файла	cycle-values loop-file inf no	checked=loop_file == "inf"
	Повтор пл&ейлиста	cycle-values loop-playlist inf no	checked=loop_playlist == "inf"
	Повтор &A-B (поставить/снять точки)	ab-loop
&Главы	$chapters

&Звук
	&Дорожка	$audio-tracks
	&Устройство вывода	$audio-devices

	&Без звука	cycle mute	checked=mute
	&Громче	add volume 5
	&Тише	add volume -5

	Звук &раньше на 0.1 сек	add audio-delay -0.1
	Звук &позже на 0.1 сек	add audio-delay 0.1
	&Сбросить задержку звука	set audio-delay 0	disabled=audio_delay == 0
С&убтитры
	&Дорожка	$sub-tracks
	&Показывать	cycle sub-visibility	checked=sub_visibility

	&Раньше на 0.5 сек	add sub-delay -0.5
	П&озже на 0.5 сек	add sub-delay 0.5
	&Сбросить задержку	set sub-delay 0	disabled=sub_delay == 0

	&Крупнее	add sub-scale 0.1
	&Мельче	add sub-scale -0.1
Ви&део
	&Настройки изображения	script-binding classicbar/image
	&Пропорции
		&Как в файле	set video-aspect-override no	checked=video_aspect_override < 0
		&16:9	set video-aspect-override 16:9	checked=math.abs(video_aspect_override - 16/9) < 1e-6
		&4:3	set video-aspect-override 4:3	checked=math.abs(video_aspect_override - 4/3) < 1e-6
		&2.35:1	set video-aspect-override 2.35:1	checked=math.abs(video_aspect_override - 2.35) < 1e-6
	Повернуть по &часовой	cycle-values video-rotate 90 180 270 0
	Повернуть п&ротив часовой	cycle-values video-rotate 270 180 90 0
	&Исходный масштаб и положение	script-message-to classicbar view-reset	disabled=video_zoom == 0 and video_pan_x == 0 and video_pan_y == 0
	&Видеодорожка	$video-tracks
	&Устранение чересстрочности	cycle deinterlace	checked=deinterlace_active

	&Скриншот на рабочий стол	screenshot video	disabled=not p["current-tracks/video"]
Ок&но
	&Полный экран	cycle fullscreen	checked=fullscreen
	Поверх &всех окон	cycle ontop	checked=ontop
	&Размер
		50%	set window-scale 0.5	checked=math.abs(get("current-window-scale", 0) - 0.5) < 0.1
		100%	set window-scale 1	checked=math.abs(get("current-window-scale", 0) - 1) < 0.1
		150%	set window-scale 1.5	checked=math.abs(get("current-window-scale", 0) - 1.5) < 0.1
		200%	set window-scale 2	checked=math.abs(get("current-window-scale", 0) - 2) < 0.1

Ин&формация о файле	script-binding stats/display-stats-toggle
В&ыход	quit
