# ============================================================
#  GomLike: mpv, настроенный «как GOM», без рекламы и обновлений
#  Строка, начинающаяся с #, это комментарий. Меняй смело.
# ============================================================

# ----- Интерфейс -----
osc=no                      # стандартную панель mpv выключаем, вместо неё своя
osd-bar=no                  # полоску громкости/перемотки рисует наша панель
title=${?media-title:${media-title} - }GomLike   # заголовок окна: «Фильм.avi - GomLike»
force-window=yes            # окно открывается, даже если запустить без файла
idle=yes                    # после закрытия файла плеер не выключается
keep-open=yes               # в конце последнего файла не закрываться
autocreate-playlist=same    # при открытии файла в плейлист попадают остальные видео из той же папки
save-position-on-quit=yes   # запоминать, где остановился
autofit-larger=90%x90%      # большое видео не вылезает за экран
snap-window=yes             # окно липнет к краям экрана
cursor-autohide=1000        # курсор прячется через 1 сек

# ----- Настройки изображения (F7, нампад) -----
# цвет, поворот, отражение, масштаб и сдвиг действуют на все файлы до закрытия плеера
# и не запоминаются для отдельных файлов
watch-later-options-remove=brightness,contrast,saturation,gamma,hue,video-rotate,glsl-shaders,video-zoom,video-pan-x,video-pan-y

# ----- Скорость и кодеки -----
vo=gpu-next                 # современный быстрый вывод видео
hwdec=auto-safe             # аппаратное декодирование видеокартой (H.264, HEVC, AV1, VP9)
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# ----- Звук -----
volume=100
volume-max=200              # можно усилить звук до 200%, как в GOM
audio-file-auto=fuzzy       # подхватывать внешние звуковые дорожки рядом с видео
alang=ru,rus,en,eng,ja,jpn

# ----- Субтитры -----
sub-auto=fuzzy              # подхватывать .srt/.ass рядом с видео, даже если имя чуть отличается
slang=ru,rus,en,eng
sub-font-size=40
sub-border-size=2.5

# ----- Скриншоты (Ctrl+E) -----
screenshot-directory=~~desktop/
screenshot-format=png

# ----- Никакого интернета -----
ytdl=no                     # плеер ничего не качает и никуда не ходит
