# ============================================================
#  Горячие клавиши «как в GOM»
#  Формат: КЛАВИША  команда
#  Остальные стандартные клавиши mpv тоже работают.
# ============================================================

# ----- Воспроизведение -----
SPACE           cycle pause
ENTER           cycle fullscreen
KP_ENTER        cycle fullscreen
Alt+ENTER       cycle fullscreen
ESC             set fullscreen no
MBTN_LEFT       script-binding classicbar/click     # клик по видео: пауза
MBTN_LEFT_DBL   script-binding classicbar/dblclick  # полный экран; на пустом экране — открыть файл
MBTN_RIGHT      script-binding classicbar/context-menu  # меню (системное меню Windows, пункты в menu.conf)
MBTN_MID        script-binding classicbar/playlist  # нажатие на колесико: плейлист

# ----- Перемотка -----
LEFT            repeatable script-message-to classicbar seek -5
RIGHT           repeatable script-message-to classicbar seek 5
Ctrl+LEFT       repeatable script-message-to classicbar seek -30
Ctrl+RIGHT      repeatable script-message-to classicbar seek 30
Shift+LEFT      repeatable script-message-to classicbar seek -60
Shift+RIGHT     repeatable script-message-to classicbar seek 60
f               frame-step                        # следующий кадр
d               frame-back-step                   # предыдущий кадр

# ----- Файлы -----
PGUP            script-binding uosc/prev          # предыдущий файл в папке
PGDWN           script-binding uosc/next          # следующий файл в папке
Ctrl+o          script-binding classicbar/open
F8              script-binding classicbar/playlist  # плейлист

# ----- Громкость (колесо мыши, как в GOM) -----
UP              add volume  5
DOWN            add volume -5
WHEEL_UP        add volume  5
WHEEL_DOWN      add volume -5
m               cycle mute

# ----- Скорость -----
c               add speed  0.1
x               add speed -0.1
z               set speed 1.0

# ----- Субтитры -----
<               add sub-delay -0.5                # субтитры раньше
>               add sub-delay  0.5                # субтитры позже
?               set sub-delay 0
Alt+h           cycle sub-visibility              # показать/скрыть
Alt+l           cycle sid                         # сменить дорожку субтитров
Alt+s           script-binding classicbar/subs-menu  # меню субтитров
Alt+a           script-binding classicbar/audio-menu # меню звука и дорожек

# ----- Картинка -----
F7              script-binding classicbar/image   # панель: цвет, поворот, отражение
1               repeatable script-message-to classicbar adjust contrast   -1
2               repeatable script-message-to classicbar adjust contrast    1
3               repeatable script-message-to classicbar adjust brightness -1
4               repeatable script-message-to classicbar adjust brightness  1
5               repeatable script-message-to classicbar adjust gamma      -1
6               repeatable script-message-to classicbar adjust gamma       1
7               repeatable script-message-to classicbar adjust saturation -1
8               repeatable script-message-to classicbar adjust saturation  1

# Масштаб и сдвиг картинки на нампаде (с NumLock и без)
KP_ADD          repeatable script-message-to classicbar zoom  0.1   # приблизить
KP_SUBTRACT     repeatable script-message-to classicbar zoom -0.1   # отдалить
KP7             repeatable script-message-to classicbar pan xy -0.02 -0.02  # картинку вверх-влево
KP_HOME         repeatable script-message-to classicbar pan xy -0.02 -0.02
KP9             repeatable script-message-to classicbar pan xy  0.02 -0.02  # вверх-вправо
KP_PGUP         repeatable script-message-to classicbar pan xy  0.02 -0.02
KP1             repeatable script-message-to classicbar pan xy -0.02  0.02  # вниз-влево
KP_END          repeatable script-message-to classicbar pan xy -0.02  0.02
KP3             repeatable script-message-to classicbar pan xy  0.02  0.02  # вниз-вправо
KP_PGDWN        repeatable script-message-to classicbar pan xy  0.02  0.02
KP8             repeatable script-message-to classicbar pan y -0.02  # картинку вверх
KP_UP           repeatable script-message-to classicbar pan y -0.02
KP2             repeatable script-message-to classicbar pan y  0.02  # вниз
KP_DOWN         repeatable script-message-to classicbar pan y  0.02
KP4             repeatable script-message-to classicbar pan x -0.02  # влево
KP_LEFT         repeatable script-message-to classicbar pan x -0.02
KP6             repeatable script-message-to classicbar pan x  0.02  # вправо
KP_RIGHT        repeatable script-message-to classicbar pan x  0.02
KP5             script-message-to classicbar view-reset  # исходный масштаб и положение
KP_BEGIN        script-message-to classicbar view-reset

a               cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
Alt+1           set window-scale 0.5
Alt+2           set window-scale 1.0
Alt+3           set window-scale 1.5
Alt+4           set window-scale 2.0
Ctrl+e          screenshot video                  # скриншот на рабочий стол
TAB             script-binding stats/display-stats-toggle   # инфо о файле и кодеках

# ============================================================
#  Те же клавиши для русской раскладки,
#  чтобы не переключать язык, пока смотришь.
#  osd-auto ничего не меняет (это поведение по умолчанию), но из-за
#  него эти клавиши не дублируются подписью в меню по правому клику
# ============================================================
а               osd-auto frame-step
в               osd-auto frame-back-step
ь               osd-auto cycle mute
с               osd-auto add speed  0.1
ч               osd-auto add speed -0.1
я               osd-auto set speed 1.0
Б               osd-auto add sub-delay -0.5
Ю               osd-auto add sub-delay  0.5
,               osd-auto set sub-delay 0
Alt+р           osd-auto cycle sub-visibility
Alt+д           osd-auto cycle sid
Alt+ы           osd-auto script-binding classicbar/subs-menu
Alt+ф           osd-auto script-binding classicbar/audio-menu
ф               osd-auto cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
Ctrl+щ          osd-auto script-binding classicbar/open
Ctrl+у          osd-auto screenshot video
